name: Publish GPT Action Monitor

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and publish
        required: true
        default: main
        type: string
      version:
        description: Userscript version (for example 0.7.5)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-gpt-action-monitor
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SCRIPT_DIR: userscripts/gpt-action-monitor
      ASSET: dist/gpt-action-monitor.user.js
      TAG_PREFIX: gpt-action-monitor-v
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Validate branch and version
        id: release
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BRANCH" >/dev/null
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          tag="${TAG_PREFIX}${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: userscripts/gpt-action-monitor/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SCRIPT_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.SCRIPT_DIR }}
        run: npm test

      - name: Build release userscript
        working-directory: ${{ env.SCRIPT_DIR }}
        env:
          USERSCRIPT_VERSION: ${{ inputs.version }}
          USERSCRIPT_OUTFILE: ../../${{ env.ASSET }}
        run: npm run build

      - name: Verify release userscript
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -s "$ASSET"
          grep -Eq "^// @version[[:space:]]+$VERSION$" "$ASSET"
          grep -Fq "// @updateURL    https://github.com/qqq694637644/github_skills_action/releases/latest/download/gpt-action-monitor.user.js" "$ASSET"
          grep -Fq "// @downloadURL  https://github.com/qqq694637644/github_skills_action/releases/latest/download/gpt-action-monitor.user.js" "$ASSET"
          node --check "$ASSET"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          notes=$(printf 'Built from branch `%s` at commit `%s`.' "$BRANCH" "$COMMIT")
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "GPT Action Monitor v$VERSION" \
            --notes "$notes" \
            --latest
