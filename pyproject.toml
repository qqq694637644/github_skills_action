[project]
name = "workspace-mcp"
version = "1.0.0"
description = "Personal Remote Workspace MCP server with persistent workspaces and PowerShell execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "workspace-mcp contributors" },
]
dependencies = [
    "mcp==2.2.0",
    "pydantic>=2.0.0",
    "PyJWT[crypto]>=2.10.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]

[project.scripts]
workspace-mcp = "workspace_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["workspace_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
